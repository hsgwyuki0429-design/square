<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101113"><meta name="description" content="長方形から生まれる、正方形だけの小さな世界。寸法と色を変えて遊ぶインタラクティブなモザイク。"><title>SIKAKU — 四角のアトリエ</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><a class="brand" href="./"><span class="brand-mark">▦</span> SIKAKU<span class="brand-jp">四角のアトリエ</span></a><span class="edition">A LITTLE GEOMETRY, A LOT OF PLAY.</span><span class="lab">INTERACTIVE LAB <i>01</i></span></header>
<section class="intro"><div><div class="eyebrow">RECTANGLE → SQUARES</div><h1>四角から、ひろがる。</h1><p>寸法を決めて、あなただけのモザイクを。</p></div><form id="dimensions"><label>短辺<input id="short" inputmode="decimal" value="60" autocomplete="off"></label><span class="times">×</span><label>長辺<input id="long" inputmode="decimal" value="100" autocomplete="off"></label><button class="primary" type="submit">生成する <span>↗</span></button></form></section>
<p id="error" role="alert" hidden></p><div id="notice" class="notice" role="status"></div>
<section class="workspace" aria-label="モザイクの描画エリア"><div class="canvas-top"><div class="canvas-title"><span class="live-dot"></span> CANVAS <span id="ratio">100 × 60</span></div><div class="segmented small" aria-label="向き"><button id="horizontal" aria-pressed="true">▭ 横向き</button><button id="vertical" aria-pressed="false">▯ 縦向き</button></div></div>
<div class="viewport" id="viewport"><canvas id="canvas" aria-label="正方形のモザイク。ドラッグで移動、ホイールやピンチで拡大縮小。" tabindex="0"></canvas><div class="dimension-tag" id="dimension-tag">100 : 60</div><div class="selection" id="selection" hidden></div></div>
<div class="canvas-bottom"><div class="segmented" aria-label="操作モード"><button id="select-tool" aria-pressed="true">⌖ 選択</button><button id="focus-tool" aria-pressed="false">⊙ 密集地点</button></div><span class="gesture-hint" id="hint">タップで四角を選択 · ドラッグで移動</span><div class="zoom-tools"><button id="zoom-out" aria-label="縮小">−</button><span id="zoom">100%</span><button id="zoom-in" aria-label="拡大">＋</button><button id="fit">⛶ 全体を表示</button></div></div></section>
<section class="playback"><div class="play-actions"><button id="play" aria-label="分割アニメーションを再生">▶</button><button id="restart" aria-label="最初から再生">↶</button><span id="play-label">分割を眺める</span></div><div class="timeline"><div id="progress"></div></div><span id="step-count">完成</span><div class="square-count"><strong id="count">0</strong> squares</div></section>
<section class="controls"><div class="mode-row"><div><div class="eyebrow">MAKE IT YOURS</div><h2>模様で遊ぶ</h2></div><div class="segmented modes" aria-label="分割モード"><button data-mode="basic" aria-pressed="false">▧ 基本</button><button data-mode="mosaic" aria-pressed="false">▦ モザイク</button><button data-mode="focus" aria-pressed="true">▩ 集中</button></div><button id="shuffle" class="shuffle">⤨ 模様と色を再生成</button></div><p class="mode-description" id="mode-description">ひとつの場所へ、小さな四角が集まる。</p>
<details id="settings"><summary>細かさ・配色・アニメーション <span>調整する ＋</span></summary><div class="settings-grid"><label>細かさ <output id="detail-value">900</output><input type="range" id="detail" min="30" max="4000" step="10" value="900"><small>再分割の予算。実際の個数は模様によって変わります。</small></label><label>密集の強さ <output id="strength-value">70</output><input type="range" id="strength" min="0" max="100" value="70"></label><label>配色<select id="palette"><option value="vivid">鮮やかな多色</option><option value="pastel">パステル</option><option value="mono">モノクロ</option></select></label><label>アニメーション速度 <output id="speed-value">1×</output><input id="speed" type="range" min="0.25" max="4" step="0.25" value="1"></label><label class="check"><input id="outlines" type="checkbox" checked> 輪郭線を表示</label><label>乱数シード<input id="seed" value="2048" maxlength="64"><small>同じ設定とシードで、同じ模様に。</small></label></div></details></section>
<footer><span><span class="footer-mark">▦</span> すべて、正方形。隙間なく、どこまでも。</span><span id="geometry-status">整数精度で分割 · 面積一致</span></footer></main><script type="module" src="app.mjs"></script></body></html>
